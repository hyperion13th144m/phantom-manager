<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phantom 全文検索システム管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <h1>phantom 全文検索システム管理</h1>
  <span id="job" class="job"></span>
  <button type="button" id="cancel" hidden>中止</button>
  <span class="grow"></span>
  <button type="button" id="refresh">状態を更新</button>
  <span id="conn" class="badge badge-off">未接続</span>
  <span id="version" class="version"></span>
</header>

<main>
  <div class="row">
    <section class="panel">
      <h2>環境チェック</h2>
      <ul id="checks" class="checks"></ul>
      <div class="panel-actions">
        <span id="checked-at" class="muted"></span>
      </div>
    </section>

    <section class="panel">
      <h2>バージョン</h2>
      <div id="repo-summary" class="summary">読み込み中…</div>
      <div class="panel-actions">
        <button type="button" data-action="repo/clone">クローン</button>
        <button type="button" data-action="repo/pull">更新 (pull)</button>
        <button type="button" data-action="repo/fetch">バージョン一覧を取得</button>
      </div>
      <div class="panel-actions">
        <select id="tag" aria-label="バージョン"></select>
        <button type="button" data-action="repo/checkout">チェックアウト</button>
        <button type="button" data-action="repo/unpin">最新ブランチに戻す</button>
      </div>
    </section>
  </div>

  <section class="panel">
    <h2>データディレクトリ</h2>
    <div class="form">
      <label for="srcDir">取込先 (PHANTOM_SRC_DIR)</label>
      <input type="text" id="srcDir" spellcheck="false">

      <label for="dataDir">展開先 (PHANTOM_DATA_DIR)</label>
      <input type="text" id="dataDir" spellcheck="false">

      <label for="httpPort">公開ポート (PHANTOM_HTTP_PORT)</label>
      <input type="number" id="httpPort" min="1" max="65535">

      <label for="publicUrl">公開 URL (PHANTOM_PUBLIC_URL)</label>
      <div class="field-row">
        <input type="text" id="publicUrl" spellcheck="false">
        <button type="button" id="use-lan">LAN IP を使う</button>
      </div>
    </div>
    <div class="panel-actions">
      <button type="button" data-action="env/save">.env.docker を保存</button>
      <span id="env-status" class="muted"></span>
    </div>
  </section>

  <section class="panel">
    <h2>取込スクリプトの作成</h2>
    <p class="muted note">
      Windows のフォルダから取込先へコピーする .bat を生成します。
      コピー自体は Windows 側で robocopy が行うため、生成後にエクスプローラから実行してください。
    </p>

    <div class="field-row">
      <label for="source">取込元</label>
      <input type="text" id="source" spellcheck="false" placeholder="P:\jpodata または \\server\share\dir">
      <button type="button" data-action="mirror/browse">フォルダを選ぶ</button>
    </div>

    <div id="picker" class="picker" hidden>
      <div class="picker-bar">
        <button type="button" id="picker-up">上へ</button>
        <span id="picker-path" class="mono"></span>
        <span class="grow"></span>
        <button type="button" id="picker-choose">ここを選ぶ</button>
        <button type="button" id="picker-close">閉じる</button>
      </div>
      <ul id="picker-list" class="picker-list"></ul>
    </div>

    <div class="panel-actions">
      <button type="button" data-action="mirror/create">取込スクリプトを作成</button>
      <span id="mirror-status" class="muted"></span>
    </div>
    <dl id="mirror-result" class="result" hidden></dl>
  </section>

  <section class="panel">
    <h2>サービス</h2>
    <div class="panel-actions">
      <button type="button" data-action="compose/build">ビルド</button>
      <button type="button" data-action="compose/pull">イメージを取得</button>
      <button type="button" data-action="compose/up">起動</button>
      <button type="button" data-action="compose/down">停止</button>
      <a id="phantom-url" class="url" href="#" target="_blank" rel="noreferrer"></a>
    </div>
    <div id="compose-error" class="muted"></div>
    <table class="services">
      <thead>
        <tr><th>サービス</th><th>状態</th><th>Status</th><th>ポート</th></tr>
      </thead>
      <tbody id="services"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>ログ</h2>
    <div id="log" class="log" aria-live="polite"></div>
    <div class="log-actions">
      <button type="button" id="clear">表示をクリア</button>
      <label><input type="checkbox" id="follow" checked> 自動スクロール</label>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
