<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phantom 全文検索システム管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <h1>phantom 全文検索システム管理</h1>
  <span class="grow"></span>
  <span id="job" class="job"></span>
  <button type="button" id="cancel" hidden>中止</button>
  <span id="conn" class="badge badge-off">未接続</span>
  <span id="version" class="version"></span>
</header>

<main>
  <section class="panel">
    <h2>環境チェック</h2>
    <ul id="checks" class="checks"></ul>
    <div class="panel-actions">
      <button type="button" id="recheck">再チェック</button>
      <span id="checked-at" class="muted"></span>
    </div>
  </section>

  <section class="panel">
    <h2>バージョン</h2>
    <div id="repo-summary" class="summary">読み込み中…</div>
    <div class="panel-actions">
      <button type="button" data-op="clone">クローン</button>
      <button type="button" data-op="pull">更新 (pull)</button>
      <button type="button" data-op="fetch">バージョン一覧を取得</button>
    </div>
    <div class="panel-actions">
      <label for="tag">バージョン</label>
      <select id="tag"></select>
      <button type="button" data-op="checkout">チェックアウト</button>
      <button type="button" data-op="unpin">最新ブランチに戻す</button>
    </div>
  </section>

  <section class="panel">
    <h2>データディレクトリ</h2>
    <form id="env-form" class="form">
      <label for="srcDir">取込先 (PHANTOM_SRC_DIR)</label>
      <input type="text" id="srcDir" name="srcDir" spellcheck="false">

      <label for="dataDir">展開先 (PHANTOM_DATA_DIR)</label>
      <input type="text" id="dataDir" name="dataDir" spellcheck="false">

      <label for="httpPort">公開ポート (PHANTOM_HTTP_PORT)</label>
      <input type="number" id="httpPort" name="httpPort" min="1" max="65535">

      <label for="publicUrl">公開 URL (PHANTOM_PUBLIC_URL)</label>
      <div class="field-row">
        <input type="text" id="publicUrl" name="publicUrl" spellcheck="false">
        <button type="button" id="use-lan">LAN IP を使う</button>
      </div>
    </form>
    <div class="panel-actions">
      <button type="button" id="save-env">.env.docker を保存</button>
      <span id="env-status" class="muted"></span>
    </div>
  </section>

  <section class="panel">
    <h2>ログ</h2>
    <div id="log" class="log" aria-live="polite"></div>
    <div class="log-actions">
      <button type="button" id="clear">表示をクリア</button>
      <label><input type="checkbox" id="follow" checked> 自動スクロール</label>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
